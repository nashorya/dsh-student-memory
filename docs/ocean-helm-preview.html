<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舵手打捞</title>
<style>
  :root {
    --sky: #b9def0;
    --surface: #7ec8e6;
    --mid: #1d5f86;
    --deep: #0b2436;
    --foam: #e8f4fb;
    --accent: #7ec8e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--deep); color: var(--foam); font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 420px; margin: 28px auto; padding: 0 16px 48px; }
  h1 { font-size: 16px; font-weight: 650; margin: 0 0 8px; }
  .note { color: #9ec4d8; margin: 0 0 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  button {
    appearance: none; border: 0; border-radius: 999px; padding: 8px 14px;
    background: #164864; color: var(--foam); cursor: pointer;
  }
  button[aria-pressed="true"] { background: var(--accent); color: var(--deep); }
  .scene {
    position: relative; overflow: hidden; border-radius: 20px;
    height: 520px; box-shadow: 0 16px 40px rgba(0,0,0,.35);
  }
  .band { position: absolute; left: 0; right: 0; }
  .sky { top: 0; height: 34%; background: linear-gradient(#d8eef8, #8ec8e6); }
  .mid { top: 34%; height: 28%; background: linear-gradient(#3a8bb8, #1d5f86); }
  .deep { top: 62%; height: 38%; background: linear-gradient(#164864, #071821); }
  .tag {
    position: absolute; left: 16px; display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 650; letter-spacing: .02em;
  }
  .tag.helm { top: 14px; color: #0b2436; }
  .tag.dive { top: 36%; color: #d6eaf6; }
  .tag.abyss { top: 64%; color: #d6eaf6; }
  .tag svg { width: 16px; height: 16px; }
  .waves {
    position: absolute; left: -60%; width: 220%; height: 28px;
    pointer-events: none;
  }
  .waves path { fill: currentColor; }
  .surface-waves { top: 31.2%; color: #3a8bb8; animation: drift 10s linear infinite; }
  .surface-waves.back { top: 30.2%; color: #8ec8e6; opacity: .55; animation: drift 16s linear infinite reverse; }
  .deep-waves { top: 60.4%; color: #123d56; opacity: .7; animation: drift 18s linear infinite; }
  .ship {
    position: absolute; left: 50%; top: 22%; width: 96px; height: 96px;
    color: #0b2436;
    filter: drop-shadow(0 6px 10px rgba(11,36,54,.2));
    animation: bob 4.8s ease-in-out infinite;
  }
  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(-18%); }
  }
  @keyframes bob {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, calc(-50% - 4px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .waves, .ship { animation: none; }
    .ship { transform: translate(-50%, -50%); }
  }
  .line {
    position: absolute; left: 50%; top: 30%; width: 2px; background: #e8f4fb;
    transform: translateX(-50%); height: 0; opacity: 0;
    border-radius: 2px;
  }
  .loot {
    position: absolute; left: 50%; width: 44px; height: 44px;
    transform: translate(-50%, 0); opacity: 0; color: #e8f4fb;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.35));
  }
  .loot svg { width: 44px; height: 44px; }
  .scene[data-haul="l2"] .line { height: 22%; opacity: 1; transition: height .45s ease; }
  .scene[data-haul="l3"] .line { height: 42%; opacity: 1; transition: height .6s ease; }
  .scene[data-haul="l2"] .loot-l2 {
    top: 42%; opacity: 1; animation: rise .65s ease-out;
  }
  .scene[data-haul="l3"] .loot-l3 {
    top: 72%; opacity: 1; animation: rise .8s ease-out;
  }
  .scene[data-haul="write"] .loot-write {
    top: 76%; opacity: 1; animation: sink 1.15s ease-in both;
  }
  .bubble {
    position: absolute; left: 50%; border-radius: 50%;
    border: 1.5px solid rgba(232, 244, 251, .45); opacity: 0;
    pointer-events: none;
  }
  .scene[data-haul="write"] .bubble-a { width: 8px; height: 8px; margin-left: 14px; animation: bubble 1.1s ease-out .15s both; }
  .scene[data-haul="write"] .bubble-b { width: 5px; height: 5px; margin-left: -18px; animation: bubble 1s ease-out .35s both; }
  .scene[data-haul="write"] .bubble-c { width: 6px; height: 6px; margin-left: 4px; animation: bubble .9s ease-out .55s both; }
  @keyframes rise {
    from { transform: translate(-50%, 36px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }
  @keyframes sink {
    from { transform: translate(-50%, -220px); opacity: .95; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }
  @keyframes bubble {
    from { top: 72%; opacity: .7; }
    to { top: 34%; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scene[data-haul="write"] .loot-write { animation: none; top: 76%; }
    .bubble { display: none; }
  }
  .credit { margin-top: 14px; color: #6f93a8; font-size: 12px; }
</style>
<main>
  <h1>捞上来是取用，沉下去是写入</h1>
  <p class="note">取任务状态或过往经验时往上捞。写下 lesson 后，书沉进深水，变成库里的一条。</p>
  <div class="row">
    <button type="button" data-haul="" aria-pressed="true">空闲</button>
    <button type="button" data-haul="l2">潜水 · 任务状态</button>
    <button type="button" data-haul="l3">深水 · 过往经验</button>
    <button type="button" data-haul="write">写入 lesson</button>
  </div>
  <div class="scene" id="scene" data-haul="">
    <div class="band sky"></div>
    <div class="band mid"></div>
    <div class="band deep"></div>
    <svg class="waves surface-waves back" viewBox="0 0 240 20" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 11 Q 15 6 30 11 T 60 11 T 90 11 T 120 11 T 150 11 T 180 11 T 210 11 T 240 11 V20 H0Z"/>
    </svg>
    <svg class="waves surface-waves" viewBox="0 0 240 20" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 10 Q 20 4 40 10 T 80 10 T 120 10 T 160 10 T 200 10 T 240 10 V20 H0Z"/>
    </svg>
    <svg class="waves deep-waves" viewBox="0 0 240 20" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 11 Q 18 8 36 11 T 72 11 T 108 11 T 144 11 T 180 11 T 216 11 T 240 11 V20 H0Z"/>
    </svg>
    <div class="tag helm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10.189V14"/><path d="M12 2v3"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-8.188-3.639a2 2 0 0 0-1.624 0L3 14a11.6 11.6 0 0 0 2.81 7.76"/><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>
      舵手 · 本拍工作集
    </div>
    <div class="tag dive">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v16"/><path d="m19 13 2-1a9 9 0 0 1-18 0l2 1"/><path d="M9 11h6"/><circle cx="12" cy="4" r="2"/></svg>
      潜水 · 任务状态
    </div>
    <div class="tag abyss">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/><path d="M18 12v.5"/><path d="M16 17.93a9.77 9.77 0 0 1 0-11.86"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33"/><path d="M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4"/><path d="m16.01 17.93-.23 1.4A2 2 0 0 1 13.8 21H9.5a5.96 5.96 0 0 0 1.49-3.98"/></svg>
      深水 · 过往经验
    </div>
    <svg class="ship" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10.189V14"/><path d="M12 2v3"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-8.188-3.639a2 2 0 0 0-1.624 0L3 14a11.6 11.6 0 0 0 2.81 7.76"/><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>
    <div class="line"></div>
    <div class="loot loot-l2">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg>
    </div>
    <div class="loot loot-l3">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg>
    </div>
    <div class="loot loot-write">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg>
    </div>
    <span class="bubble bubble-a"></span>
    <span class="bubble bubble-b"></span>
    <span class="bubble bubble-c"></span>
  </div>
  <p class="credit">图标来自 Lucide（MIT）。unDraw 的钓鱼图需从官网手动下载，许可不允许自动抓取。</p>
</main>
<script>
  const scene = document.getElementById('scene')
  const buttons = [...document.querySelectorAll('button[data-haul]')]
  function apply(haul) {
    scene.dataset.haul = haul
    buttons.forEach((btn) => btn.setAttribute('aria-pressed', String(btn.dataset.haul === haul)))
  }
  buttons.forEach((btn) => btn.addEventListener('click', () => apply(btn.dataset.haul)))
</script>
</html>
